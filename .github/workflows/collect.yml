name: collect
on:
  schedule:
    - cron: "17 1 * * *"   # every night, about 03:17 Israel time
  workflow_dispatch:
    inputs:
      stores:
        description: "Stores to collect (blank = all, none = only publish the page)"
        required: false
      force:
        description: "Stores whose count may drop by more than half this time (a deliberate change, not a broken shop)"
        required: false
  push:
    branches: [main]
    paths: [index.html]
permissions:
  contents: write
concurrency: glilot-collect
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Bring the published site
        run: |
          git fetch -q --depth=1 origin site
          git worktree add -q _site FETCH_HEAD
      - name: Collect
        if: github.event_name != 'push' && github.event.inputs.stores != 'none'
        env:
          GLILOT_OUT: ${{ github.workspace }}/_site/data
          STORES: ${{ github.event.inputs.stores }}
          GLILOT_FORCE: ${{ github.event.inputs.force }}
        run: python3 scripts/collect.py $STORES
      - name: Publish, keeping a single commit so the repository does not grow
        run: |
          cp index.html _site/index.html
          touch _site/.nojekyll
          cd _site
          git config user.name "glilot-bot"
          git config user.email "glilot-bot@users.noreply.github.com"
          git checkout -q --orphan fresh
          git add -A
          git commit -qm "פורטל גלילות: עדכון"
          git push -qf origin fresh:site
