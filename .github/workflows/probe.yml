name: probe
on:
  workflow_dispatch:
    inputs:
      args: {description: "arguments for the script", required: false}
      script: {description: "script in scripts/ to run", required: false, default: probe.py}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - env:
          ARGS: ${{ github.event.inputs.args }}
          SCRIPT: ${{ github.event.inputs.script || 'probe.py' }}
        run: python3 "scripts/$SCRIPT" $ARGS
